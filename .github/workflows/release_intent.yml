name: Release Intent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  pull-requests: read
  issues: write

jobs:
  validate:
    name: Release Intent
    runs-on: ubuntu-latest
    steps:
      - uses: AtlassianPS/AtlassianPS.Standards/.github/actions/validate-release-intent@7efc986344a4e8c4ffb108d5e3b69f45ef3857c4 # v0.5.0
