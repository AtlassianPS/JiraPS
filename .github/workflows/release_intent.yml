name: Release Intent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  pull-requests: read
  issues: write

jobs:
  validate:
    name: Release Intent
    runs-on: ubuntu-latest
    steps:
      - uses: AtlassianPS/AtlassianPS.Standards/.github/actions/validate-release-intent@fa0c5f72ddb2b96712ffb8f8f0623fa7220d9dd8 # v0.4.1
