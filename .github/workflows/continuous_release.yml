name: Continuous Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_impact:
        description: Initial JiraPS release impact (v3 is still pending)
        required: true
        type: choice
        options:
          - major

      release_channel:
        description: Stable release or an immutable alpha/beta candidate
        required: true
        default: stable
        type: choice
        options: [stable, alpha, beta]
      major_authorization:
        description: Fresh major authorization as owner/repository vMAJOR
        required: false
        type: string
      prerelease_branch:
        description: Optional source branch for alpha/beta (empty uses master)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.JIRAPS_CD_ENABLED == 'true'
    uses: AtlassianPS/AtlassianPS.Standards/.github/workflows/module_release.yml@df1de3e48d5ee30401ecfcbfa7a11118c8d842ac # v0.4.1 + #73
    with:
      module-name: JiraPS
      release-impact: ${{ inputs.release_impact }}
      release-channel: ${{ inputs.release_channel || 'stable' }}
      prerelease-branch: ${{ inputs.prerelease_branch }}
      major-authorization: ${{ inputs.major_authorization }}
      build-profile: jiraps
      smoke-profile: jira
      exclude-documentation-tests: true
    secrets: inherit
