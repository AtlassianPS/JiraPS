name: Continuous Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_impact:
        description: Initial JiraPS release impact (v3 is still pending)
        required: true
        type: choice
        options:
          - major

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.JIRAPS_CD_ENABLED == 'true'
    uses: AtlassianPS/AtlassianPS.Standards/.github/workflows/module_release.yml@347ded1033c302cf6dbbd8c614aefe2477121ab0 # v0.4.0
    with:
      module-name: JiraPS
      release-impact: ${{ inputs.release_impact }}
    secrets: inherit
