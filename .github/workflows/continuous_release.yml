name: Continuous Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_impact:
        description: Initial JiraPS release impact (v3 is still pending)
        required: true
        type: choice
        options:
          - major

      release_channel:
        description: Stable release or an immutable alpha/beta candidate
        required: true
        default: stable
        type: choice
        options: [stable, alpha, beta]
      major_authorization:
        description: Fresh major authorization as owner/repository vMAJOR
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.JIRAPS_CD_ENABLED == 'true'
    uses: AtlassianPS/AtlassianPS.Standards/.github/workflows/module_release.yml@8053d48b6b5ee1b40196f4463fb3eaf2cfab026f # v0.4.1 + #73
    with:
      module-name: JiraPS
      release-impact: ${{ inputs.release_impact }}
      release-channel: ${{ inputs.release_channel || 'stable' }}
      major-authorization: ${{ inputs.major_authorization }}
      build-profile: jiraps
      smoke-profile: jira
      exclude-documentation-tests: true
    secrets: inherit
