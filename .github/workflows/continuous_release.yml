name: Continuous Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_impact:
        description: Initial JiraPS release impact (v3 is still pending)
        required: true
        type: choice
        options:
          - major

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.JIRAPS_CD_ENABLED == 'true'
    uses: AtlassianPS/AtlassianPS.Standards/.github/workflows/module_release.yml@fa0c5f72ddb2b96712ffb8f8f0623fa7220d9dd8 # v0.4.1
    with:
      module-name: JiraPS
      release-impact: ${{ inputs.release_impact }}
    secrets: inherit
